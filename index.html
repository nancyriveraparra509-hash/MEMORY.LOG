<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMORY.LOG</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #00ff66;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .pantalla {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .oculto {
      display: none;
    }

    h1 {
      font-size: clamp(28px, 8vw, 60px);
      margin: 10px;
      text-shadow: 0 0 8px #00ff66;
    }

    p {
      font-size: clamp(16px, 4vw, 26px);
      text-shadow: 0 0 6px #00ff66;
    }

    button {
      background: #000;
      color: #00ff66;
      border: 2px solid #00ff66;
      padding: 14px 35px;
      margin: 10px;
      font-family: "Courier New", monospace;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 0 5px #00ff66;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }

    button:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 20px #00ff66;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 22px;
      background: #00ff66;
      margin-left: 5px;
      animation: parpadear 0.8s infinite;
    }

    @keyframes parpadear {
      50% {
        opacity: 0;
      }
    }

    .interferencia {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        #00ff66 4px
      );
    }

    #activar {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
    }
  </style>
</head>

<body>

  <div class="interferencia"></div>

  <!-- PANTALLA PARA ACTIVAR EL SONIDO -->
  <section id="activar" class="pantalla">
    <h1>MEMORY.LOG</h1>
    <p>TOCA PARA INICIAR</p>
    <span class="cursor"></span>
  </section>

  <!-- PANTALLA 1 -->
  <section id="inicio" class="pantalla oculto">
    <h1 id="textoInicio"></h1>
    <p id="subtexto"></p>
    <span class="cursor"></span>
  </section>

  <!-- PANTALLA 2 -->
  <section id="comenzar" class="pantalla oculto">
    <h1>NIVEL 1</h1>
    <p>El sistema está listo.</p>

    <button onclick="mostrarPregunta()">
      COMENZAR
    </button>
  </section>

  <!-- PANTALLA 3 -->
  <section id="pregunta" class="pantalla oculto">
    <h1>¿QUIERES COMENZAR?</h1>

    <div>
      <button onclick="aceptar()">SÍ</button>
      <button onclick="rechazar()">NO</button>
    </div>

    <p id="respuesta"></p>
  </section>

  <!-- PANTALLA 4 -->
  <section id="juego" class="pantalla oculto">
    <h1>JUEGO INICIADO</h1>
    <p>Bienvenido al Nivel 1...</p>
  </section>


  <script>

    let audioContext;

    /*
      ACTIVAR EL AUDIO
    */

    function iniciarAudio() {

      audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }


    /*
      SONIDO DE TECLADO ANTIGUO
      Volumen reducido para que sea más suave.
    */

    function sonidoTecla() {

      if (!audioContext) return;

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type = "square";

      oscillator.frequency.setValueAtTime(
        450 + Math.random() * 150,
        audioContext.currentTime
      );

      gain.gain.setValueAtTime(
        0.025,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.06
      );

      oscillator.connect(gain);

      gain.connect(
        audioContext.destination
      );

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + 0.06
      );
      } 


    /*
      TEXTO QUE APARECE LETRA POR LETRA
    */

    const texto = "NIVEL 1";

    const subtitulo =
      "INICIANDO JUEGO...";

    let i = 0;
    let j = 0;


    function escribirTitulo() {

      if (i < texto.length) {

        document.getElementById(
          "textoInicio"
        ).textContent +=
          texto.charAt(i);

        sonidoTecla();

        i++;

        setTimeout(
          escribirTitulo,
          140
        );

      } else {

        setTimeout(
          escribirSubtitulo,
          500
        );
      }
    }


    function escribirSubtitulo() {

      if (j < subtitulo.length) {

        document.getElementById(
          "subtexto"
        ).textContent +=
          subtitulo.charAt(j);

        sonidoTecla();

        j++;

        setTimeout(
          escribirSubtitulo,
          80
        );

      } else {

        setTimeout(() => {

          document.getElementById(
            "inicio"
          ).classList.add("oculto");

          document.getElementById(
            "comenzar"
          ).classList.remove("oculto");

        }, 1500);
      }
    }


    /*
      EMPEZAR EL JUEGO
    */

    function empezarJuego() {

      iniciarAudio();

      document.getElementById(
        "activar"
      ).classList.add("oculto");

      document.getElementById(
        "inicio"
      ).classList.remove("oculto");

      escribirTitulo();
    }


    /*
      BOTÓN COMENZAR
    */

    function mostrarPregunta() {

      document.getElementById(
        "comenzar"
      ).classList.add("oculto");

      document.getElementById(
        "pregunta"
      ).classList.remove("oculto");
    }


    /*
      BOTÓN SÍ
    */

    function aceptar() {

      document.getElementById(
        "pregunta"
      ).classList.add("oculto");

      document.getElementById(
        "juego"
      ).classList.remove("oculto");
    }


    /*
      BOTÓN NO
    */

    function rechazar() {

      document.getElementById(
        "respuesta"
      ).textContent =
        "Está bien... todavía puedes pensarlo.";

      setTimeout(() => {

        document.getElementById(
          "respuesta"
        ).textContent = "";

      }, 2000);
    }


    /*
      EL PRIMER TOQUE ACTIVA EL SONIDO
    */

    document.getElementById(
      "activar"
    ).addEventListener(
      "click",
      empezarJuego
    );

  </script>

</body>
</html>
