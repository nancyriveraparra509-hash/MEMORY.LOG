<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMORY.LOG</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #00ff66;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .pantalla {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
      overflow-y: auto;
    }

    .oculto {
      display: none;
    }

    h1 {
      font-size: clamp(28px, 8vw, 60px);
      margin: 10px;
      text-shadow: 0 0 8px #00ff66;
    }

    h2 {
      font-size: clamp(22px, 6vw, 42px);
      margin: 10px;
      text-shadow: 0 0 8px #00ff66;
    }

    p {
      max-width: 900px;
      font-size: clamp(16px, 4vw, 23px);
      line-height: 1.6;
      text-shadow: 0 0 6px #00ff66;
    }

    button {
      background: #000;
      color: #00ff66;
      border: 2px solid #00ff66;
      padding: 14px 35px;
      margin: 10px;
      font-family: "Courier New", monospace;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 0 5px #00ff66;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }

    button:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 20px #00ff66;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 22px;
      background: #00ff66;
      margin-left: 5px;
      animation: parpadear 0.8s infinite;
    }

    @keyframes parpadear {
      50% {
        opacity: 0;
      }
    }

    .interferencia {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        #00ff66 4px
      );
      z-index: 20;
    }

    #activar {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
    }
